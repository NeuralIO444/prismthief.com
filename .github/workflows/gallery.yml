name: Build gallery from photo drops

on:
  push:
    paths:
      - "photos/**"
      - "tools/**"
      - ".github/workflows/gallery.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install Pillow
      - run: python tools/build_gallery.py
      - name: Quality gate (a failed check means nothing is committed)
        run: python tools/check_site.py
      - name: Commit rebuilt gallery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Gallery already up to date"
          else
            git commit -m "Auto-build gallery from photo drop"
            git push
          fi
